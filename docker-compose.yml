# Todo en Docker: la base de datos (Postgres) y la app (la API y el panel web salen del mismo servidor).
#
#   docker compose up -d --build     →  http://localhost:3000
#   docker compose logs -f app       →  ver qué está pasando
#   docker compose down              →  apagar (los datos quedan en el volumen "pgdata")
#
# La configuración (contraseñas, Evolution, Resend…) se lee del archivo .env.
# En tu PC, docker compose también carga docker-compose.override.yml, que publica los puertos.
# Dokploy usa solo este archivo (-f docker-compose.yml).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: invitaciones
      POSTGRES_USER: urbby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbby}
    volumes:
      # Los datos viven en este volumen: sobrevive a redeploys y a `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbby -d invitaciones"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      DATABASE_URL: postgres://urbby:${POSTGRES_PASSWORD:-urbby}@db:5432/invitaciones
    depends_on:
      db:
        condition: service_healthy
    # Sin puertos publicados: en Dokploy el tráfico entra por el dominio (Traefik) y el puerto 3000
    # del servidor ya lo usa el panel de Dokploy. En tu PC los publica docker-compose.override.yml.
    expose:
      - "3000"

volumes:
  pgdata:
